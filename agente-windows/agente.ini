# Configuración del agente de inventario
# Este archivo debe estar en la misma carpeta que AgenteInventario.exe

# Endpoint de la API (NestJS)
url=http://localhost:3000/api/inventario

# Debe coincidir con API_KEY del archivo .env de la API
apikey=demo-clave-cambiar

# Tiempo de espera por intento, en segundos
timeout=30
